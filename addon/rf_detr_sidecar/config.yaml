name: RF-DETR Segmentation
version: "3.0.7"
slug: rf_detr_sidecar
description: >-
  Local RF-DETR instance segmentation sidecar for the RF-DETR + LLM Vision integration.
  Detects people, animals, vehicles, and other objects in camera images.
  Runs entirely locally — no cloud API costs.
  Installation and first start may take several minutes (image build and model download).
url: "https://github.com/lauritssn/yolo-llm-vision"
startup: services
boot: auto
host_network: false
ingress: true
ingress_port: 8000
ingress_entry: /try
init: false
homeassistant: "2025.1.0"

arch:
  - amd64
  - aarch64

ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "RF-DETR segmentation API"

map:
  - media:rw

options:
  model: "nano"
  confidence_threshold: 0.5
  log_level: "info"

schema:
  model: "list(nano|small|medium|large)"
  confidence_threshold: "float(0.1,1.0)"
  log_level: "list(debug|info|warning|error)"

panel_icon: "mdi:cctv"
panel_title: "Try RF-DETR"
panel_admin: false
panel_color: "#41BDF5"
