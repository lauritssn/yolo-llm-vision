analyze:
  name: Analyze camera
  description: >-
    Grab a snapshot from a camera, run RF-DETR segmentation via the sidecar,
    and optionally run AI Task or LLM Vision threat analysis. Returns detection
    classes, confidence, count, and optional ai_analysis / threat_detected.
  fields:
    entity_id:
      name: Camera entity
      description: The camera entity ID to analyze.
      required: true
      example: camera.front_door
      selector:
        entity:
          domain: camera
    force_llm:
      name: Force LLM analysis
      description: >-
        Force LLM Vision analysis even if it is not configured in the
        integration options. Requires llmvision to be installed.
      default: false
      selector:
        boolean:
