# =============================================================================
# RF-DETR Sidecar — Standalone Deployment
# =============================================================================
# Use this if you run the sidecar separately from your HA docker-compose.
# Make sure this container can reach HA and vice versa (see docs/setup.md).
#
# For the recommended approach (adding the sidecar to your existing HA
# docker-compose), see docs/setup.md → Option A.
# =============================================================================

services:
  rf-detr-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf-detr-sidecar
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8000/health', timeout=8.0); r.raise_for_status(); assert r.json().get('status') in ('ok','starting')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

    # --- NVIDIA GPU acceleration (uncomment if you have a GPU) ---
